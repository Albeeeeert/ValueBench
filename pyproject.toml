[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-eval"
version = "0.3.0"
description = "Self-contained Plan-Game single-author multimodal benchmark pipeline"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
value-eval = "value_eval.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["value_eval*"]

[tool.setuptools.package-data]
"value_eval.augmentation" = ["assets/fonts/*.TTF", "assets/nltk_data/**/*"]
"*" = ["config.yaml"]
