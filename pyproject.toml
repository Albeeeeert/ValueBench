[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-eval"
version = "0.3.0"
description = "Self-contained Plan-Game single-author multimodal benchmark pipeline"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "Pillow>=10,<13",
  "openpyxl>=3.1,<4",
]

[project.scripts]
value-eval = "value_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["value_eval*"]
